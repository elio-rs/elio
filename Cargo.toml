[workspace]
members = [
    "crates/elio-query",
    "crates/elio-cmd",
    "crates/elio-common",
    "crates/elio-common/macros",
    "crates/elio-query/macros",
    "crates/elio-logictest",
    "crates/elio-parser",
    "crates/elio-plannertest",
    "crates/elio-storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
elio-common = { path = "crates/elio-common" }
elio-logictest = { path = "crates/elio-logictest" }
elio-parser = { path = "crates/elio-parser" }
elio-plannertest = { path = "crates/elio-plannertest" }
elio-query = { path = "crates/elio-query" }
elio-storage = { path = "crates/elio-storage" }

# other
arc-swap = "1.8"
anyhow = "1.0"
async-stream = "0.3.6"
async-trait = "0.1.89"
bitvec = "1"                                         # array bitmap
bytes = "1"
chrono = "0.4"
clap = "4.5"
derive_more = { version = "2", features = ["full"] }
downcast-rs = "2"
educe = "0.6.0"
either = "1.15.0"
enum-as-inner = "0.6"
futures = "0.3"
hashbrown = { version = "0.14", features = ["raw"] }
indexmap = "2.12.0"
iso8601-duration = "0.2.0"                           # for duration parsing
itertools = "0.14.0"
jiff = "0.2.16"                                      # for temporal data repr
ordered-float = "5.1.0"                              # float scalar type repr
paste = "1.0"
pretty-xmlish = "0.1.13"                             # plan node explain
proc-macro2 = "1.0"                                  # expr proc macros
quote = "1.0"                                        # expr proc macros
regex = "1"                                          # for parsing expr macros fuction signature
roaring = "0.11.3"                                   # for path storage(not used by now)
serde = "1"                                          # for ser/de catalog entry
serde_json = "1"                                     # for ser/de catalog entry
sqlplannertest = "0.4.1"
syn = { version = "2.0", features = ["full"] }       # expr proc macros
thiserror = "2"
tikv-jemallocator = "0.6"                            # for fast memory alloc
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.43"
# dev-depencies
datatest-stable = "0.3"
insta = { version = "1.43", features = ["yaml"] }
sqllogictest = "0.28"
tempfile = "3"

[profile.dev.package]
# make insta run faster
insta.opt-level = 3
similar.opt-level = 3
