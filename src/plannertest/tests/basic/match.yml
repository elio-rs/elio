- sql: |
    MATCH (n) RETURN n
  desc: match without label
  tasks: 
    - bind
    - plan
- sql: |
    MATCH (n:Person) RETURN n
  desc: match with label
  tasks:
    - bind
    - plan
- sql: |
    MATCH (n:Person) RETURN *
  desc: match and return wild card
  tasks:
    - bind
    - plan
- sql: |
    MATCH (n:Person) RETURN n.name
  desc: match with projection
  tasks:
    - bind
    - plan
- sql: |
    MATCH (a:Person), (b:Person) WHERE a.age > b.age RETURN a, b
  desc: match with cross product
  tasks:
    - bind
    - plan
- sql: |
    MATCH (a:Person)--(b), (c:Person)--(d) WHERE a.age > c.age RETURN a, b, c, d
  desc: match with cross product and overlapping variables
  tasks:
    - bind
    - plan